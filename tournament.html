<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OmegaSwiss</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
            integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
            crossorigin="anonymous"
            defer></script>
    <!-- Bootstrap loaded via vite -->
    <script type="module" src="./src/main.ts" defer></script>

    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png">
    <link rel="manifest" href="./favicon/site.webmanifest">
</head>
<body class="p-3">
<h1 id="mainTitle" class="d-inline-block">Omega Swiss</h1>
<a type="button" class="btn btn-primary" href="./index.html">
    Volver
</a>

<div id="roundSection" class="card" data-draw-is-draw="false">
    <div class="navbar navbar-light bg-light" id="headingRound"
         data-bs-toggle="collapse" data-bs-target="#collapseRound"
         aria-expanded="true" aria-controls="collapseRound">
        <h5 class="mb-0 d-flex align-items-center" style="padding-left: 1rem;">
            <i class="bi bi-caret-down-fill hide-on-expanded"></i>
            <i class="bi bi-caret-up-fill show-on-expanded"></i>
            <button class="btn btn-link">
                Torneo
            </button>
        </h5>
    </div>
    <div id="collapseRound" class="collapse" aria-labelledby="headingRound">
        <div class="card-body">
            <div class="row m-1">
                <div class="col-2 text-start">
                    <button id="goBackRound" type="button" class="btn btn-secondary text-nowrap"
                            title="Volver a la ronda anterior">
                        <i class="bi bi-skip-backward-fill"></i>
                    </button>
                    <h5 id="roundCountDisplay" class="d-inline-block">Ronda X/Y</h5>
                </div>
                <div class="col-2 text-start">
                    <button id="endRound" type="button" class="btn btn-primary text-nowrap">Terminar ronda</button>
                </div>
                <div class="col-2 text-start">
                    <button id="endTournament" type="button" class="btn btn-secondary text-nowrap"
                            style="display: none;">
                        <i class="bi bi-trophy-fill"></i> Cerrar torneo
                    </button>
                </div>
                <div class="col-2 text-start">
                    <button id="swapEditingTables" type="button" class="btn btn-primary text-nowrap"><i
                            class="bi bi-pencil-square"></i> Editar
                    </button>
                </div>
                <div class="col-2 text-start">
                    <button id="rerollRound" type="button" class="btn btn-primary text-nowrap"><i
                            class="bi bi-dice-6-fill"></i> Reroll
                    </button>
                </div>
                <div class="col-2 text-start">
                    <div class="row">
                        <div class="col-12 col-lg-6 d-flex align-items-center">
                            <div class="row">
                                <p class="col-12 m-0">Cambiar a:</p>
                            </div>
                        </div>
                        <div class="col-12 col-lg-6 text-start">
                            <button id="swapDrawDraw" type="button" class="btn btn-warning text-nowrap">
                                Empate
                            </button>
                            <button id="swapDrawDoubleKo" type="button" class="btn btn-danger text-nowrap">
                                Doble KO
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <table id="mainTable" class="table table-striped table-bordered" data-editing-tables="false">
                    <thead>
                    <tr class="table-dark">
                        <th scope="col" class="col"></th>
                        <th scope="col" class="col-6"></th>
                        <th scope="col" class="col"></th>
                        <th scope="col" class="col-6"></th>
                    </tr>
                    </thead>
                    <tbody class="table-group-divider"></tbody>
                </table>
            </div>
            <div id="retreatSection" class="row" style="display: none;">
                <h5>Retiradas de la ronda</h5>
                <table id="roundRetreatTable" class="table table-striped table-bordered">
                    <thead>
                    <tr class="table-dark">
                        <th scope="col" class="col-12"></th>
                        <th scope="col" class="col"></th>
                    </tr>
                    </thead>
                    <tbody class="table-group-divider"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="incompleteRoundModal" tabindex="-1" role="dialog"
         aria-labelledby="incompleteRoundModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="incompleteRoundModalLabel">Ronda incompleta</h5>
                </div>
                <div class="modal-body">
                    No todos los enfrentamientos tienen resultado, no se puede cerrar la ronda.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="rankingSection" class="card">
    <div class="navbar navbar-light bg-light" id="headingRanking"
         data-bs-toggle="collapse" data-bs-target="#collapseRanking"
         aria-expanded="true" aria-controls="collapseRanking">
        <h5 class="mb-0 d-flex align-items-center" style="padding-left: 1rem;">
            <i class="bi bi-caret-down-fill hide-on-expanded"></i>
            <i class="bi bi-caret-up-fill show-on-expanded"></i>
            <button class="btn btn-link">
                Clasificacion
            </button>
        </h5>
    </div>
    <div id="collapseRanking" class="collapse" aria-labelledby="headingRanking">
        <div class="card-body">
            <div class="row p-1">
                <table id="rankingTable" class="table table-striped table-bordered">
                    <thead>
                    <tr class="table-dark">
                        <th scope="col" class="col"></th>
                        <th scope="col" class="col-4">Jugador</th>
                        <th scope="col" class="col-4">Resultados</th>
                        <th scope="col" class="col-4">Tie-breaker</th>
                    </tr>
                    </thead>
                    <tbody class="table-group-divider"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
