<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OmegaSwiss</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
            integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
            crossorigin="anonymous"
            defer></script>
    <!-- Bootstrap loaded via vite -->
    <script type="module" src="./src/index.ts" defer></script>

    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png">
    <link rel="manifest" href="./favicon/site.webmanifest">
</head>
<body class="p-3">
<h1 id="mainTitle">
    Omega Swiss
</h1>

<div id="playerSection" class="card">
    <div class="navbar navbar-light bg-light" id="headingPlayers"
         data-bs-toggle="collapse" data-bs-target="#collapsePlayers"
         aria-expanded="true" aria-controls="collapsePlayers">
        <h5 class="mb-0 d-flex align-items-center" style="padding-left: 1rem;">
            <i class="bi bi-caret-down-fill hide-on-expanded"></i>
            <i class="bi bi-caret-up-fill show-on-expanded"></i>
            <button class="btn btn-link">
                Nuevo torneo
            </button>
        </h5>
    </div>
    <div id="collapsePlayers" class="collapse" aria-labelledby="headingPlayers">
        <div class="card-body">
            <div class="row">
                <div class="form-group col-3">
                    <label for="player-name-input" class="visually-hidden">Nombre o alias</label>
                    <input id="player-name-input" class="form-control col-1" type="text" placeholder="Nombre/Alias">
                </div>
                <div class="form-group col-3">
                    <button id="new-player" type="button" class="btn btn-primary text-nowrap">Añadir</button>
                </div>
                <div class="form-group col-3 invisible">
                    <button id="export-players" type="button" class="btn btn-primary text-nowrap">Export
                    </button>
                    <button id="import-players" type="button" class="btn btn-primary text-nowrap">Export
                    </button>
                </div>
                <div class="form-group col-3">
                    <button id="resetPlayers" type="button" class="btn btn-danger float-end text-nowrap">
                        Borrar todos
                    </button>
                </div>
            </div>
            <div class="row p-1">
                <table id="player-table" class="table table-striped table-bordered">
                    <thead>
                    <tr class="table-dark">
                        <th scope="col" class="col-12">Jugadores</th>
                        <th scope="col" class="col"></th>
                    </tr>
                    </thead>
                    <tbody class="table-group-divider"></tbody>
                </table>
            </div>
        </div>
        <div class="row p-3">
            <div class="col-3 text-start">
                <button id="startTournament" type="button" class="btn btn-primary text-nowrap">Empezar</button>
            </div>
            <div class="col-3 text-start">
            </div>
            <div class="col-6 text-end">
                <h5 id="requiredRoundDisplay">Rondas necesarias: 0</h5>
            </div>
        </div>
    </div>
</div>

<div id="tournamentsSection" class="card">
    <div class="navbar navbar-light bg-light" id="headingTournaments"
         data-bs-toggle="collapse" data-bs-target="#collapseTournaments"
         aria-expanded="true" aria-controls="collapseTournaments">
        <h5 class="mb-0 d-flex align-items-center" style="padding-left: 1rem;">
            <i class="bi bi-caret-down-fill hide-on-expanded"></i>
            <i class="bi bi-caret-up-fill show-on-expanded"></i>
            <button class="btn btn-link">
                Torneos
            </button>
        </h5>
    </div>
    <div id="collapseTournaments" class="collapse" aria-labelledby="headingTournaments">
        <div class="card-body">
            <div class="row">
                <div class="col-3">
                </div>
                <div class="col-3">
                </div>
                <div class="col-3">
                </div>
                <div class="col-3">
                    <button id="clearTournaments" type="button" class="btn btn-danger float-end text-nowrap">
                        Borrar todos
                    </button>
                </div>
            </div>
            <div class="row p-1">
                <table id="tournamentsTable" class="table table-striped table-bordered">
                    <thead>
                    <tr class="table-dark">
                        <th scope="col" class="col-12"></th>
                        <th scope="col" class="col"></th>
                        <th scope="col" class="col"></th>
                    </tr>
                    </thead>
                    <tbody class="table-group-divider"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
